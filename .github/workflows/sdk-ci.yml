name: SDK CI

on:
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'pnpm-lock.yaml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/sdk-ci.yml'
  pull_request:
    paths:
      - 'sdk/**'
      - 'pnpm-lock.yaml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/sdk-ci.yml'

concurrency:
  group: sdk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cache-key:
    name: Derive cache keys
    runs-on: ubuntu-latest
    outputs:
      pnpm-key: ${{ steps.pnpm.outputs.key }}
      cargo-key: ${{ steps.cargo.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      - name: Derive pnpm cache key
        id: pnpm
        shell: bash
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            lock_hash=$(sha256sum pnpm-lock.yaml | cut -d' ' -f1)
          else
            echo "::warning::pnpm-lock.yaml missing; using no-lockfile cache key"
            lock_hash="no-lockfile"
          fi
          node_version=$(node --version 2>/dev/null || echo "no-node")
          pnpm_version=$(pnpm --version 2>/dev/null || echo "no-pnpm")
          key="pnpm-${RUNNER_OS}-${node_version}-${pnpm_version}-${lock_hash}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

      - name: Derive Cargo cache key
        id: cargo
        shell: bash
        run: |
          set -euo pipefail
          if [ -f Cargo.lock ]; then
            lock_hash=$(sha256sum Cargo.lock | cut -d' ' -f1)
          else
            echo "::warning::Cargo.lock missing; using no-lockfile cache key"
            lock_hash="no-lockfile"
          fi
          toolchain=$(grep -E '^channel' rust-toolchain.toml 2>/dev/null | head -n1 | tr -d ' "' | cut -d= -f2 || true)
          toolchain=${toolchain:-stable}
          target=${CARGO_BUILD_TARGET:-$(rustc -vV 2>/dev/null | awk '/host:/{print $2}' || echo "unknown-target")}
          key="cargo-${RUNNER_OS}-${toolchain}-${target}-${lock_hash}"
          echo "key=${key}" >> "$GITHUB_OUTPUT"

  sdk:
    name: Build & test SDK
    needs: cache-key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ needs.cache-key.outputs.pnpm-key }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm --filter ./sdk build

      - name: Test SDK
        run: pnpm --filter ./sdk test

  contracts:
    name: Build & test contracts
    needs: cache-key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ needs.cache-key.outputs.cargo-key }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Build contracts
        run: cargo build --locked

      - name: Test contracts
        run: cargo test --locked
