name: Docs Validate

on:
  push:
    paths:
      - 'docs/openapi.yaml'
      - 'docs/api-reference.md'
      - 'deployments/**'
      - 'scripts/generate-openapi-docs.ts'
      - 'scripts/validate-manifest.ts'
      - '.github/workflows/docs-validate.yml'
  pull_request:
    paths:
      - 'docs/openapi.yaml'
      - 'docs/api-reference.md'
      - 'deployments/**'
      - 'scripts/generate-openapi-docs.ts'
      - 'scripts/validate-manifest.ts'
      - '.github/workflows/docs-validate.yml'

jobs:
  openapi:
    name: OpenAPI spec + generated reference
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate OpenAPI spec and check reference docs are up to date
        run: pnpm docs:openapi:check

  deployment-manifests:
    name: Deployment manifest validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate deployment manifests
        run: pnpm validate-manifest
