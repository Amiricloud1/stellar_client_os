name: Docs CI

on:
  push:
    paths:
      - "docs/**"
      - "apps/mobile/OFFLINE.md"
      - "apps/mobile/src/offline/**"
      - "apps/web/src/lib/env.ts"
      - "apps/web/src/lib/s3/config.ts"
      - "apps/web/src/lib/__tests__/env-reference.test.ts"
      - "apps/web/src/lib/__tests__/testing-guide.test.ts"
      - "CONTRIBUTING.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "TESTING_GUIDE.md"
      - "QUICKSTART.md"
      - ".env.example"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "apps/mobile/OFFLINE.md"
      - "apps/mobile/src/offline/**"
      - "apps/web/src/lib/env.ts"
      - "apps/web/src/lib/s3/config.ts"
      - "apps/web/src/lib/__tests__/env-reference.test.ts"
      - "apps/web/src/lib/__tests__/testing-guide.test.ts"
      - "CONTRIBUTING.md"
      - ".github/PULL_REQUEST_TEMPLATE.md"
      - "TESTING_GUIDE.md"
      - "QUICKSTART.md"
      - ".env.example"
      - ".github/workflows/docs.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Mobile offline tests (cache + sync guarantees)
        run: pnpm --filter @fundable/mobile test

      - name: Mobile offline typecheck
        run: pnpm --filter @fundable/mobile typecheck

      - name: Web docs tests (env reference + testing guide)
        run: pnpm --filter @fundable/web test -- src/lib/__tests__/env-reference.test.ts src/lib/__tests__/testing-guide.test.ts src/lib/__tests__/env.test.ts

      - name: Required docs files exist
        run: |
          test -f docs/environment-variables.md || (echo "missing docs/environment-variables.md" && exit 1)
          test -f CONTRIBUTING.md || (echo "missing CONTRIBUTING.md" && exit 1)
          test -f .github/PULL_REQUEST_TEMPLATE.md || (echo "missing PR template" && exit 1)
          test -f TESTING_GUIDE.md || (echo "missing TESTING_GUIDE.md" && exit 1)
          grep -q "NEXT_PUBLIC_PAYMENT_STREAM_CONTRACT_ID" .env.example || (echo ".env.example missing web keys" && exit 1)
          grep -q "closes #" .github/PULL_REQUEST_TEMPLATE.md || (echo "PR template missing issues section" && exit 1)
