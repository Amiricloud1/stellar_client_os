name: Contracts CI

on: [push, pull_request]

env:
  # Canonical toolchain pins. Keep in sync with .tool-versions / package.json.
  NODE_VERSION: "20.11.1"
  PNPM_VERSION: "9.1.0"
  RUST_VERSION: "1.78.0"
  STELLAR_CLI_VERSION: "23.0.1"

jobs:
  toolchain:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@v23.0.1

      - name: Verify toolchain versions
        run: |
          set -euo pipefail
          fail=0
          check() {
            local name="$1" expected="$2" actual="$3"
            if [ "$actual" != "$expected" ]; then
              echo "::error::Toolchain mismatch for $name: expected '$expected' but found '$actual'. Update your local install or the pin in .github/workflows/contracts.yml."
              fail=1
            else
              echo "OK: $name $actual"
            fi
          }
          check node "$NODE_VERSION" "$(node --version | sed 's/^v//')"
          check pnpm "$PNPM_VERSION" "$(pnpm --version)"
          check rust "$RUST_VERSION" "$(rustc --version | awk '{print $2}')"
          check stellar "$STELLAR_CLI_VERSION" "$(stellar version | awk '{print $2}')"
          exit $fail

  test:
    runs-on: ubuntu-latest
    needs: toolchain

    steps:
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install Stellar cli
        uses: stellar/stellar-cli@v23.0.1

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --all
