name: Contracts CI

on: [push, pull_request]

jobs:
  test: 
    runs-on: ubuntu-latest

    steps: 
      - name: checkout repo
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84.0"
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Install Stellar cli
        uses: stellar/stellar-cli@v23.0.1

      - name: Cache Cargo 
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}-${{ hashFiles('contracts/**/Cargo.toml') }}-wasm32-unknown-unknown
          restore-keys: |
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}-wasm32-unknown-unknown-
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-${{ hashFiles('rust-toolchain.toml') }}-
            cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}-
            cargo-${{ runner.os }}-

      - name: Run contract tests
        working-directory: contracts
        run: cargo test --all
        continue-on-error: true
